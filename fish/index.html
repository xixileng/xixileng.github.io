<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06223a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>鲸吞 · 深海进化</title>
    <script type="module" crossorigin src="./assets/index-DMbN2acu.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bj3Tb6h3.css">
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="touch-layer"></div>
    <div id="joy-base"><div id="joy-knob"></div></div>

    <div id="hud" class="hidden">
      <div id="hud-status" class="panel">
        <div class="row">
          <span id="hud-species"></span>
          <span id="hud-tier"></span>
        </div>
        <div id="hud-biome" class="biome-chip"></div>
        <div class="bar"><div id="hud-xpbar"></div></div>
        <div id="hud-xptext" class="sub"></div>
        <div id="hud-stamina-block" class="stamina-block">
          <div class="stamina-head">
            <span class="stamina-name"><span class="stamina-bolt">⚡</span>体力</span>
            <span id="hud-stamina-text" class="stamina-value">100%</span>
          </div>
          <div class="stamina-track">
            <div id="hud-stamina" class="stamina-fill"></div>
            <i class="stamina-notch"></i>
          </div>
        </div>
        <div id="hud-buffs"></div>
      </div>

      <div id="hud-hold" class="panel hidden">
        <div class="row"><span>👑 称霸倒计时</span><b id="hud-hold-text"></b></div>
        <div class="bar gold"><div id="hud-holdbar"></div></div>
      </div>

      <div id="hud-hunt" class="panel hunt hidden">
        <div class="row"><span>🩸 深海震怒 · 猎手围猎中</span><b id="hud-hunt-text"></b></div>
      </div>

      <div id="hud-boss" class="panel boss hidden">
        <div class="row"><span>👑 深渊利维坦</span><b id="hud-boss-text"></b></div>
        <div class="bar boss"><div id="hud-bossbar"></div></div>
      </div>

      <div id="hud-board" class="panel"></div>
      <canvas id="minimap" width="140" height="140"></canvas>

      <div id="controls">
        <button id="btn-item" class="ctrl-btn">
          <span id="item-icon">·</span>
          <span id="item-name">道具</span>
          <span id="item-key">Q</span>
        </button>
        <button id="btn-boost" class="ctrl-btn">加速</button>
        <button id="btn-skill" class="ctrl-btn">
          <span id="skill-icon"></span>
          <span id="skill-name"></span>
          <span id="skill-cd"></span>
          <span id="skill-key">E / 右键</span>
        </button>
      </div>
      <div id="toast"></div>
    </div>

    <div id="menu" class="overlay">
      <div class="menu-card">
        <h1>鲸吞</h1>
        <p class="tagline">大鱼吞小鱼，小鱼咬尾巴。进化成利维坦，称霸深海 60 秒。</p>
        <input id="name-input" maxlength="10" placeholder="给你的鱼起个名字" />
        <div id="species-grid"></div>
        <div id="species-detail"></div>
        <div id="records" class="sub records"></div>
        <div id="nemesis" class="sub nemesis"></div>
        <div class="menu-actions">
          <button id="start-btn" class="primary">下 海</button>
          <button id="daily-btn" class="ghost">今日挑战</button>
          <button id="profile-btn" class="ghost">深海档案</button>
        </div>
        <div id="equipped-title" class="sub title-line"></div>
        <div id="daily-info" class="sub daily-info"></div>
        <div id="help" class="sub"></div>
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <div class="menu-card small">
        <h2 id="result-title"></h2>
        <p id="result-desc"></p>
        <div id="result-stats"></div>
        <div id="result-detail" class="sub records"></div>
        <div id="result-best" class="sub records"></div>
        <div id="result-daily" class="sub records"></div>
        <div id="result-unlock" class="sub unlock"></div>
        <div class="result-actions">
          <button id="again-btn" class="primary">再来一局</button>
          <button id="copy-btn" class="ghost">复制战绩</button>
        </div>
        <div id="copy-status" class="sub"></div>
      </div>
    </div>

    <div id="mutation" class="overlay hidden">
      <div class="menu-card small mutation-draft">
        <div class="mutation-head">
          <h2 id="mutation-title">进化选择</h2>
          <span id="mutation-countdown"></span>
        </div>
        <p id="mutation-sub" class="sub"></p>
        <div id="mutation-cards"></div>
        <div class="mutation-timer"><div id="mutation-timerbar"></div></div>
      </div>
    </div>

    <div id="profile" class="overlay hidden">
      <div class="menu-card">
        <h2>深海档案</h2>
        <p id="profile-summary" class="sub"></p>
        <div id="profile-species"></div>
        <h3 class="profile-heading">称号</h3>
        <div id="profile-titles"></div>
        <button id="profile-close" class="primary">返回</button>
      </div>
    </div>

    <button id="btn-audio" class="ctrl-btn" title="关闭声音" aria-label="音效开关">🔊</button>

  </body>
</html>
